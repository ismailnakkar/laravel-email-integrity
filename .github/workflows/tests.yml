name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} · ${{ matrix.deps }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite
          coverage: none

      - run: composer update --${{ matrix.deps }} --prefer-dist --no-interaction --no-progress

      - if: matrix.php == '8.5' && matrix.deps == 'prefer-stable'
        run: vendor/bin/pint --test

      - run: vendor/bin/phpunit

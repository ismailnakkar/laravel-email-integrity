name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        deps: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          # Laravel 13 needs PHP 8.3.
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.deps }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite
          coverage: none

      # Testbench picks the Laravel major; prefer-lowest installs composer.json's own floors.
      - run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update

      # Larastan needs Laravel 12.4.1, above the declared 12.1 floor; only the analysis leg runs it.
      - if: matrix.deps == 'prefer-lowest'
        run: composer remove --dev larastan/larastan --no-update --no-interaction

      # The lowest legs install the declared Laravel 12.1 and 13.0 floors, which have security advisories; malware and
      # abandoned-package blocking stay on.
      - run: composer update --${{ matrix.deps }} --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: ${{ matrix.deps == 'prefer-lowest' && '0' || '1' }}

      - if: matrix.php == '8.5' && matrix.deps == 'prefer-stable' && matrix.laravel == '13.*'
        run: vendor/bin/pint --test

      - if: matrix.php == '8.5' && matrix.deps == 'prefer-stable' && matrix.laravel == '13.*'
        run: composer analyse

      - run: vendor/bin/phpunit
